{% extends 'base.html' %} {% block content %}
<h2>Edit Task</h2>

{% if task.image_name %}
<p>Current image:</p>
<picture>
  <source
    srcset="{{ url_for('static', filename='uploads/' ~ task.image_name ~ '.webp') }}"
    type="image/webp"
  />
  <img
    src="{{ url_for('static', filename='uploads/' ~ task.image_name ~ '.jpg') }}"
    alt="Current bond image"
    class="bond-image"
  />
</picture>
{% endif %}

<form method="post" enctype="multipart/form-data">
  <input type="text" name="title" value="{{ task.title }}" required /><br /><br />
  <input type="text" name="description" value="{{ task.description }}" /><br /><br />
  <label for="image">Replace image (optional — JPEG / PNG / WebP):</label><br />
  <input type="file" id="image" name="image" accept="image/*" /><br /><br />
  <button type="submit">Update</button>
</form>
<p><a href="/">← Back</a></p>
{% endblock %}
